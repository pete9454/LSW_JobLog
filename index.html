<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Job Log</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f8cff;
    --accent-dark: #3a6fd6;
    --text: #f2f3f5;
    --muted: #9aa0ab;
    --border: #2a2e37;
    --error: #ff6b6b;
    --success: #4fd67f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 22px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    color: var(--text);
    font-size: 22px;
    margin: 0 0 24px 0;
    text-align: center;
    letter-spacing: 0.3px;
  }
  label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 6px;
    margin-top: 18px;
  }
  input[type="text"],
  input[type="date"],
  select {
    width: 100%;
    padding: 14px 12px;
    font-size: 16px;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  input[type="text"]:focus,
  input[type="date"]:focus,
  select:focus {
    border-color: var(--accent);
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7);
  }
  textarea {
  width: 100%;       /* Spans the full width of the phone screen */
  box-sizing: border-box; /* Prevents padding from breaking the width */
  max-width: 100%;   /* Keeps it from overflowing its container */
  padding: 12px;     /* Makes it easy to tap on mobile devices */
  font-size: 16px;   /* Prevents iOS from zooming in automatically */
}
  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%239aa0ab' stroke-width='2' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }
  button {
    width: 100%;
    margin-top: 28px;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active {
    background: var(--accent-dark);
  }
  button:disabled {
    background: #3a3f4a;
    cursor: not-allowed;
  }
  .status {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
    color: var(--muted);
  }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }

  .setup-banner {
    background: #2a1f0f;
    border: 1px solid #6b4f1f;
    color: #e0b95e;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .setup-banner code {
    background: #10131a;
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Land &amp; Sea Welding<br>Job Log</h1>

    <div class="setup-banner" id="setupBanner">
      One-time setup needed: this app sends email via EmailJS. Open this file in a text editor and fill in your EmailJS <code>PUBLIC_KEY</code>, <code>SERVICE_ID</code>, and <code>TEMPLATE_ID</code> near the top of the script. See the setup notes below the code.
    </div>

    <label for="client">Client</label>
    <input type="text" id="client" placeholder="Client name">

    <label for="job">Job</label>
    <input type="text" id="job" placeholder="Job description">

    <label for="date">Date</label>
    <input type="date" id="date">

    <label for="startTime">Start Time</label>
    <select id="startTime"></select>

    <label for="endTime">End Time</label>
    <select id="endTime"></select>
	
	<label for="nbt">Non-billable Time (hours)</label>
    <input type="text" id="nbt" placeholder="0.5">
	
	<label for="quote">Quote - ex GST</label>
    <input type="text" id="quote" placeholder="1000">
	
	<label for="notes">Notes</label>
    <textarea id="notes" placeholder="Type Notes here" rows="4"></textarea>

    <button id="saveBtn">Save</button>
    <div class="status" id="status"></div>
  </div>

<script>
  // ====== FILL THESE IN (from your EmailJS account) ======
  const PUBLIC_KEY  = 'pNKeiJCMqNYwK_jbH';
  const SERVICE_ID  = 'service_0klbxbn';
  const TEMPLATE_ID = 'template_gnt4kvw';
  // =========================================================

  const isConfigured = !PUBLIC_KEY.startsWith('YOUR_')
                     && !SERVICE_ID.startsWith('YOUR_')
                     && !TEMPLATE_ID.startsWith('YOUR_');

  if (isConfigured) {
    emailjs.init(PUBLIC_KEY);
    document.getElementById('setupBanner').style.display = 'none';
  }

  // Default the date field to today for convenience
  document.getElementById('date').valueAsDate = new Date();

  // Populate Start/End time dropdowns with 30-minute increments
  function buildTimeOptions(selectId) {
    const select = document.getElementById(selectId);
    let optionsHtml = '<option value="">--</option>';
    for (let h = 0; h < 24; h++) {
      for (let m = 0; m < 60; m += 30) {
        const hh = String(h).padStart(2, '0');
        const mm = String(m).padStart(2, '0');
        const value = hh + ':' + mm;
        const hour12 = h % 12 === 0 ? 12 : h % 12;
        const ampm = h < 12 ? 'AM' : 'PM';
        const label = hour12 + ':' + mm + ' ' + ampm;
        optionsHtml += '<option value="' + value + '">' + label + '</option>';
      }
    }
    select.innerHTML = optionsHtml;
  }
  buildTimeOptions('startTime');
  buildTimeOptions('endTime');

  document.getElementById('saveBtn').addEventListener('click', function() {
    const client = document.getElementById('client').value.trim();
    const job = document.getElementById('job').value.trim();
    const date = document.getElementById('date').value;
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value; //nbt,quote,notes
	const nbt = document.getElementById('nbt').value;
	const quote = document.getElementById('quote').value;
	const notes = document.getElementById('notes').value;
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('saveBtn');

    statusEl.className = 'status';

    if (!client && !job) {
      statusEl.textContent = 'Enter at least one field before saving.';
      statusEl.className = 'status error';
      return;
    }

    if (!isConfigured) {
      statusEl.textContent = 'EmailJS is not configured yet — see the setup notes above.';
      statusEl.className = 'status error';
      return;
    }

    const params = {
      to_email: 'pete@iotdbs.com',
      client: client,
      job: job,
      date: date,
      start_time: startTime,
      end_time: endTime,
	  _nbt : nbt,
	  _quote : quote,
	  _notes: notes,
      logged_at: new Date().toLocaleString()
    };

    btn.disabled = true;
    statusEl.textContent = 'Sending...';

    emailjs.send(SERVICE_ID, TEMPLATE_ID, params).then(function() {
      statusEl.textContent = 'Sent to pete@iotdbs.com';
      statusEl.className = 'status success';
      document.getElementById('client').value = '';
      document.getElementById('job').value = '';
      document.getElementById('startTime').value = '';
      document.getElementById('endTime').value = '';
      document.getElementById('date').valueAsDate = new Date();
      btn.disabled = false;
    }, function(err) {
      statusEl.textContent = 'Failed to send. Check console for details.';
      statusEl.className = 'status error';
      btn.disabled = false;
      console.error('EmailJS error:', err);
    });
  });
</script>
</body>
</html>
